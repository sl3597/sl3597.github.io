{% include base_path %}
{% comment %}Command palette (⌘K / Ctrl K). Markup only; behaviour lives in /assets/js/command-palette.js, styles in /_sass/layout/_command.scss.{% endcomment %}
<div id="cmdk" class="cmdk" hidden>
  <div class="cmdk__backdrop" data-cmdk-close></div>
  <div class="cmdk__panel" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmdk__head">
      <span class="cmdk__prompt" aria-hidden="true">&rsaquo;</span>
      <span id="cmdk-mode" class="cmdk__mode" hidden></span>
      <input id="cmdk-input" class="cmdk__input" type="text" placeholder="Type a command or a city&hellip;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="cmdk-list" aria-autocomplete="list" aria-label="Search commands">
      <button class="cmdk__esc" type="button" data-cmdk-close aria-label="Close"><kbd>esc</kbd></button>
    </div>
    <ul id="cmdk-list" class="cmdk__list" role="listbox" aria-label="Commands"></ul>
    <div class="cmdk__foot">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> move</span>
      <span><kbd>&crarr;</kbd> run</span>
      <span><kbd>esc</kbd> close</span>
      <span class="cmdk__foot-right"><kbd data-modkey>&#8984;</kbd><kbd>K</kbd> anywhere</span>
    </div>
  </div>
</div>
<div id="cmdk-toast" class="cmdk-toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="cmdk-data">{"base":{{ base_path | jsonify }},"nav":[{"title":"Home","url":"/"}{% for link in site.data.navigation.main %},{"title":{{ link.title | jsonify }},"url":{{ link.url | jsonify }}}{% endfor %}],"email":{{ site.author.email | jsonify }},"linkedin":{{ site.author.linkedin | jsonify }},"github":{{ site.author.github | jsonify }},"wanderlust":"/wanderlust/"}</script>
